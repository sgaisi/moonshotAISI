[project]
name = "moonshotAISI"
version = "0.1.0"
description = "SGAISI advances AI testing with MoonshotAISI."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11, <3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License"
]

dependencies = [
    "aiohappyeyeballs~=2.6.1",
    "aiohttp~=3.12.14",
    "aiosignal~=1.4.0",
    "annotated-types~=0.7.0",
    "anyio~=4.10.0",
    "attrs~=25.3.0",
    "certifi~=2025.8.3",
    "charset-normalizer~=3.4.2",
    "click~=8.1.8",
    "cmd2~=2.5.11",
    "colorama~=0.4.6 ; platform_system == 'Windows' or sys_platform == 'win32'",
    "cryptography==44.0.1",
    "datasets~=4.1.1",
    "dependency-injector~=4.45.0",
    "dill~=0.4.0",
    "fastapi~=0.116.1",
    "filelock~=3.19.1",
    "frozenlist~=1.7.0",
    "fsspec~=2025.9.0",
    "gnureadline~=8.2.13 ; sys_platform == 'darwin'",
    "h11~=0.16.0",
    "huggingface-hub~=0.35.0",
    "idna~=3.10",
    "ijson~=3.4.0",
    "jinja2~=3.1.6",
    "markdown-it-py~=4.0.0",
    "markupsafe~=3.0.2",
    "mdurl~=0.1.2",
    "multidict~=6.6.4",
    "multiprocess~=0.70.16",
    "numpy~=1.26.4",
    "packaging~=25.0",
    "pandas~=2.3.2",
    "pathvalidate~=3.3.1",
    "propcache~=0.3.2",
    "pyarrow~=21.0.0",
    "pydantic==2.11.9",
    "pydantic-core~=2.33.2",
    "pygments~=2.19.2",
    "pyparsing~=3.2.3",
    "pyperclip~=1.9.0",
    "pyreadline3~=3.5.4 ; platform_system == 'Windows' or sys_platform == 'win32'",
    "python-dateutil~=2.9.0.post0",
    "python-dotenv~=1.1.1",
    "python-multipart~=0.0.20",
    "python-slugify~=8.0.4",
    "pytz~=2025.2",
    "pyyaml~=6.0.2",
    "requests~=2.32.4",
    "rich~=14.1.0",
    "six~=1.17.0",
    "sniffio~=1.3.1",
    "starlette~=0.48.0",
    "tenacity~=9.1.2",
    "text-unidecode~=1.3",
    "tqdm~=4.67.1",
    "typing-extensions~=4.15.0",
    "tzdata~=2025.2",
    "urllib3~=2.5.0",
    "uvicorn~=0.35.0",
    "wcwidth~=0.2.13",
    "xxhash~=3.5.0",
    "yarl~=1.20.1",
]

[tool.uv.workspace]
members = [
    "moonshot-data-aisi",
]

[dependency-groups]
dev = [
    "anybadge>=1.16.0",
    "black>=25.1.0",
    "coverage>=7.10.6",
    "flake8>=7.3.0",
    "flake8-html>=0.4.3",
    "httpx>=0.28.1",
    "isort>=6.0.1",
    "pyinstrument>=5.1.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-html>=4.1.1",
    "pytest-json>=0.4.0",
    "pytest-mock>=3.15.1",
]
